name: Build CharaRecode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct sources
        shell: bash
        run: |
          cat .buildsrc85/chunk-* > buildsrc.b85
          python - <<'PY'
          from pathlib import Path
          import base64
          Path('buildsrc.tar.xz').write_bytes(base64.b85decode(Path('buildsrc.b85').read_bytes()))
          PY
          tar -xJf buildsrc.tar.xz
          chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: chara-build
          path: build/libs/*.jar
          if-no-files-found: error
