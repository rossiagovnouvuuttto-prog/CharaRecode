name: Build CharaRecode

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct sources
        shell: bash
        run: |
          cat .buildsrc/chunk-* > buildsrc.b64
          base64 -d buildsrc.b64 > buildsrc.tar.gz
          tar -xzf buildsrc.tar.gz
          chmod +x gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: chara-build
          path: build/libs/*.jar
          if-no-files-found: error
